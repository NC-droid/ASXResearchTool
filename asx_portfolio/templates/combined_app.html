<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 py-6">
                <div class="flex justify-between items-center">
                    <h1 class="text-3xl font-bold text-purple-600">Portfolio Simulator</h1>
                    <a href="/" class="text-gray-600 hover:text-gray-900">← Back</a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Input Sidebar -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-lg shadow p-6">
                        <h2 class="text-xl font-bold mb-4">Portfolio Settings</h2>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Initial Amount ($)</label>
                                <input type="number" id="initialAmount" value="10000" class="w-full px-3 py-2 border border-gray-300 rounded-md" min="100" max="100000000">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Time Horizon (years)</label>
                                <input type="number" id="years" value="10" class="w-full px-3 py-2 border border-gray-300 rounded-md" min="1" max="50">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Simulations</label>
                                <input type="number" id="simCount" value="500" class="w-full px-3 py-2 border border-gray-300 rounded-md" min="10" max="1000">
                            </div>

                            <hr class="my-4">

                            <div>
                                <h3 class="font-bold mb-3">Holdings</h3>
                                <div id="holdings" class="space-y-3 mb-4">
                                    <div class="holding border-l-4 border-purple-600 pl-3">
                                        <input type="text" placeholder="Ticker" class="holding-ticker w-full px-2 py-1 border border-gray-300 rounded text-sm mb-1">
                                        <div class="grid grid-cols-2 gap-2">
                                            <input type="number" placeholder="Return %" class="holding-return w-full px-2 py-1 border border-gray-300 rounded text-sm" min="-200" max="500">
                                            <input type="number" placeholder="Volatility %" class="holding-vol w-full px-2 py-1 border border-gray-300 rounded text-sm" min="0" max="300">
                                        </div>
                                        <input type="number" placeholder="Allocation %" class="holding-alloc w-full px-2 py-1 border border-gray-300 rounded text-sm mt-1" min="0" max="100" step="0.1">
                                    </div>
                                </div>
                                <button id="addHoldingBtn" class="w-full bg-gray-300 text-gray-700 py-2 rounded-md hover:bg-gray-400 text-sm font-medium">
                                    + Add Holding
                                </button>
                            </div>

                            <button id="simulateBtn" class="w-full bg-purple-600 text-white py-2 rounded-md hover:bg-purple-700 font-medium mt-6">
                                Run Simulation
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Results -->
                <div class="lg:col-span-2">
                    <div id="results" class="space-y-4">
                        <div class="bg-white rounded-lg shadow p-6">
                            <p class="text-gray-500 text-center py-8">Configure your portfolio and click "Run Simulation"</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('addHoldingBtn').addEventListener('click', () => {
            const holdingsDiv = document.getElementById('holdings');
            const holding = document.createElement('div');
            holding.className = 'holding border-l-4 border-purple-600 pl-3';
            holding.innerHTML = `
                <input type="text" placeholder="Ticker" class="holding-ticker w-full px-2 py-1 border border-gray-300 rounded text-sm mb-1">
                <div class="grid grid-cols-2 gap-2">
                    <input type="number" placeholder="Return %" class="holding-return w-full px-2 py-1 border border-gray-300 rounded text-sm" min="-200" max="500">
                    <input type="number" placeholder="Volatility %" class="holding-vol w-full px-2 py-1 border border-gray-300 rounded text-sm" min="0" max="300">
                </div>
                <input type="number" placeholder="Allocation %" class="holding-alloc w-full px-2 py-1 border border-gray-300 rounded text-sm mt-1" min="0" max="100" step="0.1">
                <button class="remove-holding text-red-600 text-xs mt-1 hover:text-red-800">Remove</button>
            `;
            holdingsDiv.appendChild(holding);
            holding.querySelector('.remove-holding').addEventListener('click', () => holding.remove());
        });

        document.getElementById('simulateBtn').addEventListener('click', async () => {
            const btn = document.getElementById('simulateBtn');
            btn.disabled = true;
            btn.textContent = 'Simulating...';

            try {
                const holdings = [];
                document.querySelectorAll('.holding').forEach(h => {
                    const ticker = h.querySelector('.holding-ticker').value;
                    const ret = parseFloat(h.querySelector('.holding-return').value) || 0;
                    const vol = parseFloat(h.querySelector('.holding-vol').value) || 15;
                    const alloc = parseFloat(h.querySelector('.holding-alloc').value) || 0;
                    if (ticker && alloc > 0) {
                        holdings.push({
                            ticker,
                            annualReturn: ret,
                            volatility: vol,
                            allocation: alloc
                        });
                    }
                });

                if (holdings.length === 0) {
                    alert('Please add at least one holding with allocation > 0');
                    btn.disabled = false;
                    btn.textContent = 'Run Simulation';
                    return;
                }

                const response = await fetch('/api/simulate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        holdings,
                        initial_amount: parseFloat(document.getElementById('initialAmount').value),
                        years: parseInt(document.getElementById('years').value),
                        sim_count: parseInt(document.getElementById('simCount').value)
                    })
                });

                const data = await response.json();
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                // Results summary
                const summary = document.createElement('div');
                summary.className = 'bg-white rounded-lg shadow p-6';
                summary.innerHTML = `
                    <h3 class="text-2xl font-bold mb-4">Results</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="bg-purple-50 p-4 rounded">
                            <p class="text-gray-600 text-sm">Expected Final Value (Median)</p>
                            <p class="text-2xl font-bold text-purple-600">AUD $${data.mean_final?.toLocaleString('en-AU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) || 'N/A'}</p>
                        </div>
                        <div class="bg-green-50 p-4 rounded">
                            <p class="text-gray-600 text-sm">Probability of Profit</p>
                            <p class="text-2xl font-bold text-green-600">${(data.prob_profit * 100).toFixed(1)}%</p>
                        </div>
                        <div class="bg-blue-50 p-4 rounded">
                            <p class="text-gray-600 text-sm">Weighted Return</p>
                            <p class="text-2xl font-bold text-blue-600">${data.weighted_return_pct?.toFixed(2)}%</p>
                        </div>
                        <div class="bg-orange-50 p-4 rounded">
                            <p class="text-gray-600 text-sm">Weighted Volatility</p>
                            <p class="text-2xl font-bold text-orange-600">${data.weighted_vol_pct?.toFixed(2)}%</p>
                        </div>
                    </div>
                `;
                resultsDiv.appendChild(summary);

                // Chart
                const chartDiv = document.createElement('div');
                chartDiv.id = 'simChart';
                chartDiv.className = 'bg-white rounded-lg shadow p-6';
                resultsDiv.appendChild(chartDiv);

                Plotly.newPlot('simChart', [
                    { y: data.p10, name: 'P10 (Pessimistic)', line: {color: '#ef4444'} },
                    { y: data.p50, name: 'P50 (Median)', line: {color: '#8b5cf6', width: 3} },
                    { y: data.p90, name: 'P90 (Optimistic)', line: {color: '#10b981'} }
                ], {
                    title: 'Portfolio Growth Scenarios',
                    xaxis: { title: 'Month' },
                    yaxis: { title: 'Portfolio Value (AUD $)' },
                    hovermode: 'x unified',
                    responsive: true
                }, {responsive: true});
            } catch (error) {
                document.getElementById('results').innerHTML = `<div class="bg-red-50 rounded-lg p-6"><p class="text-red-800">Error: ${error.message}</p></div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Run Simulation';
            }
        });
    </script>
</body>
</html>

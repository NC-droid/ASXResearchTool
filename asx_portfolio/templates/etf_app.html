<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETF Screener</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 py-6">
                <div class="flex justify-between items-center">
                    <h1 class="text-3xl font-bold text-blue-600">ETF Screener</h1>
                    <a href="/" class="text-gray-600 hover:text-gray-900">← Back</a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <!-- Filters Sidebar -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-lg shadow p-6 sticky top-4">
                        <h2 class="text-xl font-bold mb-4">Filters</h2>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Risk Tolerance</label>
                                <select id="riskTolerance" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Investment Horizon</label>
                                <select id="horizon" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                                    <option value="short">Short (1-3 years)</option>
                                    <option value="medium" selected>Medium (3-10 years)</option>
                                    <option value="long">Long (10+ years)</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Min Dividend Yield (%)</label>
                                <input type="number" id="minDividend" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-md" step="0.1" min="0">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Max MER (%)</label>
                                <input type="number" id="maxMer" value="1.0" class="w-full px-3 py-2 border border-gray-300 rounded-md" step="0.01" min="0" max="10">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Results to Show</label>
                                <input type="number" id="topN" value="3" class="w-full px-3 py-2 border border-gray-300 rounded-md" min="1" max="20">
                            </div>

                            <button id="screenBtn" class="w-full bg-blue-600 text-white py-2 rounded-md hover:bg-blue-700 font-medium">
                                Screen ETFs
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Results -->
                <div class="lg:col-span-3">
                    <div id="results" class="space-y-4">
                        <div class="bg-white rounded-lg shadow p-6">
                            <p class="text-gray-500 text-center py-8">Click "Screen ETFs" to start screening</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('screenBtn').addEventListener('click', async () => {
            const btn = document.getElementById('screenBtn');
            btn.disabled = true;
            btn.textContent = 'Screening...';

            try {
                const response = await fetch('/api/screen', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        risk_tolerance: document.getElementById('riskTolerance').value,
                        horizon: document.getElementById('horizon').value,
                        min_dividend_yield_annual: parseFloat(document.getElementById('minDividend').value),
                        max_mer: parseFloat(document.getElementById('maxMer').value),
                        top_n: parseInt(document.getElementById('topN').value)
                    })
                });

                const data = await response.json();
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                if (data.picks && data.picks.length > 0) {
                    data.picks.forEach((pick, idx) => {
                        const card = document.createElement('div');
                        card.className = 'bg-white rounded-lg shadow p-6 border-l-4 border-blue-600';
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-2xl font-bold text-gray-900">${pick.ticker || 'N/A'}</h3>
                                    <p class="text-gray-600">${pick.name || 'ETF'}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-2xl font-bold text-blue-600">${(pick.score || 0).toFixed(1)}</p>
                                    <p class="text-gray-600 text-sm">Score</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                                <div class="bg-gray-50 p-3 rounded">
                                    <p class="text-gray-600 text-sm">Yield</p>
                                    <p class="text-lg font-bold">${(pick.dividend_yield * 100 || 0).toFixed(2)}%</p>
                                </div>
                                <div class="bg-gray-50 p-3 rounded">
                                    <p class="text-gray-600 text-sm">MER</p>
                                    <p class="text-lg font-bold">${(pick.mer * 100 || 0).toFixed(2)}%</p>
                                </div>
                                <div class="bg-gray-50 p-3 rounded">
                                    <p class="text-gray-600 text-sm">1Y Return</p>
                                    <p class="text-lg font-bold">${(pick.return_1y * 100 || 0).toFixed(2)}%</p>
                                </div>
                                <div class="bg-gray-50 p-3 rounded">
                                    <p class="text-gray-600 text-sm">Volatility</p>
                                    <p class="text-lg font-bold">${(pick.volatility * 100 || 0).toFixed(2)}%</p>
                                </div>
                            </div>
                            ${data.rationales && data.rationales[idx] ? `<p class="text-gray-700 text-sm italic">💡 ${data.rationales[idx]}</p>` : ''}
                        `;
                        resultsDiv.appendChild(card);
                    });
                } else {
                    resultsDiv.innerHTML = '<div class="bg-white rounded-lg shadow p-6"><p class="text-gray-500 text-center">No ETFs match your filters. Try adjusting the criteria.</p></div>';
                }
            } catch (error) {
                document.getElementById('results').innerHTML = `<div class="bg-red-50 rounded-lg p-6"><p class="text-red-800">Error: ${error.message}</p></div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Screen ETFs';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Screener</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-white shadow">
            <div class="max-w-7xl mx-auto px-4 py-6">
                <div class="flex justify-between items-center">
                    <h1 class="text-3xl font-bold text-green-600">ASX 200 Stock Screener</h1>
                    <a href="/" class="text-gray-600 hover:text-gray-900">← Back</a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 py-8">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <!-- Filters Sidebar -->
                <div class="lg:col-span-1">
                    <div class="bg-white rounded-lg shadow p-6 sticky top-4">
                        <h2 class="text-xl font-bold mb-4">Filters</h2>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Risk Tolerance</label>
                                <select id="riskTolerance" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                                    <option value="low">Low</option>
                                    <option value="medium" selected>Medium</option>
                                    <option value="high">High</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Sectors</label>
                                <div id="sectors" class="space-y-2 max-h-48 overflow-y-auto">
                                    <p class="text-gray-500 text-sm">Loading sectors...</p>
                                </div>
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Min Dividend Yield (%)</label>
                                <input type="number" id="minDividend" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-md" step="0.1" min="0">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Min Market Cap (AUD M)</label>
                                <input type="number" id="minMarketCap" value="0" class="w-full px-3 py-2 border border-gray-300 rounded-md" step="100" min="0">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-2">Results to Show</label>
                                <input type="number" id="topN" value="5" class="w-full px-3 py-2 border border-gray-300 rounded-md" min="1" max="20">
                            </div>

                            <button id="screenBtn" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700 font-medium">
                                Screen Stocks
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Results -->
                <div class="lg:col-span-3">
                    <div id="results" class="space-y-4">
                        <div class="bg-white rounded-lg shadow p-6">
                            <p class="text-gray-500 text-center py-8">Click "Screen Stocks" to start screening</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Load sectors on page load
        fetch('/api/sectors')
            .then(r => r.json())
            .then(data => {
                const sectorsDiv = document.getElementById('sectors');
                sectorsDiv.innerHTML = '';
                if (data.sectors && data.sectors.length > 0) {
                    data.sectors.forEach(sector => {
                        const label = document.createElement('label');
                        label.className = 'flex items-center';
                        label.innerHTML = `
                            <input type="checkbox" value="${sector}" class="sector-check mr-2 rounded">
                            <span class="text-sm text-gray-700">${sector}</span>
                        `;
                        sectorsDiv.appendChild(label);
                    });
                }
            })
            .catch(() => {
                document.getElementById('sectors').innerHTML = '<p class="text-red-600 text-sm">Failed to load sectors</p>';
            });

        document.getElementById('screenBtn').addEventListener('click', async () => {
            const btn = document.getElementById('screenBtn');
            btn.disabled = true;
            btn.textContent = 'Screening...';

            try {
                const sectors = Array.from(document.querySelectorAll('.sector-check:checked')).map(c => c.value);
                
                const response = await fetch('/api/screen-stocks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        risk_tolerance: document.getElementById('riskTolerance').value,
                        horizon: 'medium',
                        sectors: sectors,
                        min_dividend_yield: parseFloat(document.getElementById('minDividend').value),
                        min_market_cap_aud_m: parseFloat(document.getElementById('minMarketCap').value),
                        top_n: parseInt(document.getElementById('topN').value)
                    })
                });

                const data = await response.json();
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                if (data.picks && data.picks.length > 0) {
                    data.picks.forEach((pick, idx) => {
                        const card = document.createElement('div');
                        card.className = 'bg-white rounded-lg shadow p-6 border-l-4 border-green-600';
                        card.innerHTML = `
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-2xl font-bold text-gray-900">${pick.ticker || 'N/A'}</h3>
                                    <p class="text-gray-600">${pick.name || 'Stock'}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-2xl font-bold text-green-600">${(pick.score || 0).toFixed(1)}</p>
                                    <p class="text-gray-600 text-sm">Score</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                                <div class="bg-gray-50 p-3 rounded">
                                    <p class="text-gray-600 text-sm">Sector</p>
                                    <p class="text-lg font-bold">${pick.sector || 'N/A'}</p>
                                </div>
                                <div class="bg-gray-50 p-3 rounded">
                                    <p class="text-gray-600 text-sm">Yield</p>
                                    <p class="text-lg font-bold">${(pick.dividend_yield * 100 || 0).toFixed(2)}%</p>
                                </div>
                                <div class="bg-gray-50 p-3 rounded">
                                    <p class="text-gray-600 text-sm">P/E Ratio</p>
                                    <p class="text-lg font-bold">${(pick.pe_ratio || 0).toFixed(1)}</p>
                                </div>
                                <div class="bg-gray-50 p-3 rounded">
                                    <p class="text-gray-600 text-sm">Market Cap</p>
                                    <p class="text-lg font-bold">AUD ${(pick.market_cap_aud_m || 0).toFixed(0)}M</p>
                                </div>
                            </div>
                            ${data.rationales && data.rationales[idx] ? `<p class="text-gray-700 text-sm italic">💡 ${data.rationales[idx]}</p>` : ''}
                        `;
                        resultsDiv.appendChild(card);
                    });
                } else {
                    resultsDiv.innerHTML = '<div class="bg-white rounded-lg shadow p-6"><p class="text-gray-500 text-center">No stocks match your filters. Try adjusting the criteria.</p></div>';
                }
            } catch (error) {
                document.getElementById('results').innerHTML = `<div class="bg-red-50 rounded-lg p-6"><p class="text-red-800">Error: ${error.message}</p></div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Screen Stocks';
            }
        });
    </script>
</body>
</html>
